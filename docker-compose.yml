services:
  db:
    image: postgres:16-alpine
    container_name: loveproof-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loveproof}
      POSTGRES_USER: ${POSTGRES_USER:-loveproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loveproof}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - loveproof-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loveproof} -d ${POSTGRES_DB:-loveproof}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  loveproof-db-data:
